name: cpp_services

services:
  build:
    build: .
    volumes:
      - .:/app
      - ./build:/app/build
    command: ./spur build

  run:
    build: .
    volumes:
      - .:/app
      - ./build:/app/build
    command: ./spur test

  dev:
    build: .
    volumes:
      - .:/app
      - ./build:/app/build
    command: bash

  perf:
    build: .
    privileged: true
    volumes:
      - .:/app
      - ./build:/app/build
    command: bash

  wasm:
    build:
      context: .
      dockerfile: Dockerfile.wasm
    volumes:
      - .:/app
      - ./build:/app/build
    command: bash

  web:
    build:
      context: .
      dockerfile: Dockerfile.wasm
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./build:/app/build
    command: bash
