name: cpp_services

services:
  build:
    build: .
    volumes:
      - .:/app
      - ./build:/app/build
    command: make build

  run:
    build: .
    volumes:
      - .:/app
      - ./build:/app/build
    command: make run

  dev:
    build: .
    volumes:
      - .:/app
      - ./build:/app/build
    command: bash

  perf:
    build: .
    privileged: true
    volumes:
      - .:/app
      - ./build:/app/build
    command: bash
